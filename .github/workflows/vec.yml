name: Vec

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  vec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Check no_std library
        run: cargo check --lib

      - name: Test Vec on host
        run: |
          mv .cargo/config.toml .cargo/config.toml.bare-metal
          cargo test --target x86_64-unknown-linux-gnu --test vec
